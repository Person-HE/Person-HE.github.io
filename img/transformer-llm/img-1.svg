<svg xmlns="http://www.w3.org/2000/svg" width="850" height="520" viewBox="0 0 850 520">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad6)"/>
  <text x="425" y="35" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" text-anchor="middle">Transformer自注意力机制原理图</text>
  
  <!-- 输入序列 -->
  <rect x="80" y="70" width="100" height="35" fill="#3498db" filter="url(#shadow6)" rx="5"/>
  <text x="130" y="92" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">输入文本</text>
  
  <!-- Token化 -->
  <rect x="80" y="120" width="100" height="35" fill="#e67e22" filter="url(#shadow6)" rx="5"/>
  <text x="130" y="142" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Token化</text>
  <line x1="130" y1="105" x2="130" y2="120" stroke="#7f8c8d" stroke-width="2"/>
  
  <!-- Embedding -->
  <rect x="80" y="170" width="100" height="35" fill="#9b59b6" filter="url(#shadow6)" rx="5"/>
  <text x="130" y="192" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Embedding</text>
  <line x1="130" y1="155" x2="130" y2="170" stroke="#7f8c8d" stroke-width="2"/>
  
  <!-- 三个矩阵：Q K V -->
  <rect x="220" y="120" width="80" height="40" fill="#e74c3c" filter="url(#shadow6)" rx="5"/>
  <text x="260" y="138" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Q (Query)</text>
  <text x="260" y="153" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">查询向量</text>
  
  <rect x="220" y="170" width="80" height="40" fill="#27ae60" filter="url(#shadow6)" rx="5"/>
  <text x="260" y="188" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">K (Key)</text>
  <text x="260" y="203" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">键向量</text>
  
  <rect x="220" y="220" width="80" height="40" fill="#f39c12" filter="url(#shadow6)" rx="5"/>
  <text x="260" y="238" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">V (Value)</text>
  <text x="260" y="253" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">值向量</text>
  
  <line x1="180" y1="188" x2="220" y2="140" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="180" y1="188" x2="220" y2="190" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="180" y1="188" x2="220" y2="240" stroke="#7f8c8d" stroke-width="1.5"/>
  
  <!-- 注意力计算 -->
  <rect x="340" y="150" width="130" height="80" fill="#2c3e50" filter="url(#shadow6)" rx="8"/>
  <text x="405" y="175" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">注意力计算</text>
  <text x="405" y="195" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Attention(Q,K,V) =</text>
  <text x="405" y="212" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">softmax(QK^T/√d)V</text>
  
  <line x1="300" y1="140" x2="340" y2="175" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="300" y1="190" x2="340" y2="190" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="300" y1="240" x2="340" y2="205" stroke="#f39c12" stroke-width="1.5"/>
  
  <!-- 输出 -->
  <rect x="510" y="160" width="100" height="50" fill="#1abc9c" filter="url(#shadow6)" rx="8"/>
  <text x="560" y="182" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">注意力输出</text>
  <text x="560" y="200" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">加权表示</text>
  <line x1="470" y1="190" x2="510" y2="185" stroke="#7f8c8d" stroke-width="2"/>
  
  <!-- 右侧：多头注意力 -->
  <rect x="650" y="120" width="180" height="140" fill="#eaf2f8" stroke="#3498db" stroke-width="2" rx="8"/>
  <text x="740" y="145" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#2980b9" text-anchor="middle">多头注意力 (Multi-Head)</text>
  <text x="740" y="170" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">8个注意力头并行计算</text>
  <text x="740" y="195" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">每个头关注不同语义维度</text>
  <text x="740" y="220" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">头1: 语法关系</text>
  <text x="740" y="240" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">头2: 语义关联</text>
  <line x1="610" y1="185" x2="650" y2="185" stroke="#3498db" stroke-width="2" stroke-dasharray="4,3"/>
  
  <!-- 下方：比喻说明 -->
  <rect x="80" y="300" width="750" height="180" fill="#fff8e1" stroke="#ffc107" stroke-width="1" rx="8"/>
  <text x="455" y="330" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#856404" text-anchor="middle">🎯 生活化比喻：图书馆查资料</text>
  
  <text x="100" y="360" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start">想象你在图书馆写论文，需要查相关资料：</text>
  <text x="120" y="385" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start"><tspan font-weight="bold" fill="#e74c3c">Q (Query/查询)</tspan> = 你写的问题清单（"我想了解Transformer原理"）</text>
  <text x="120" y="410" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start"><tspan font-weight="bold" fill="#27ae60">K (Key/键)</tspan> = 每本书的目录标签（书名、章节标题）</text>
  <text x="120" y="435" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start"><tspan font-weight="bold" fill="#f39c12">V (Value/值)</tspan> = 书里的具体内容（你实际要读的内容）</text>
  <text x="120" y="460" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start">注意力计算 = 用问题清单(Q)匹配目录标签(K)，找到最相关的书，然后阅读内容(V)</text>
</svg>