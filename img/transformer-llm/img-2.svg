<svg xmlns="http://www.w3.org/2000/svg" width="850" height="520" viewBox="0 0 850 520">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad7)"/>
  <text x="425" y="35" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" text-anchor="middle">大模型核心概念关系图</text>
  
  <!-- 中心：大语言模型 -->
  <circle cx="425" cy="160" r="60" fill="#2c3e50" filter="url(#shadow7)"/>
  <text x="425" y="155" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">大语言模型</text>
  <text x="425" y="175" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">LLM</text>
  
  <!-- Token -->
  <rect x="120" y="80" width="120" height="55" fill="#3498db" filter="url(#shadow7)" rx="8"/>
  <text x="180" y="102" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Token</text>
  <text x="180" y="122" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">模型处理的最小单位</text>
  <line x1="240" y1="108" x2="365" y2="140" stroke="#3498db" stroke-width="1.5"/>
  
  <!-- 上下文窗口 -->
  <rect x="280" y="60" width="130" height="55" fill="#e67e22" filter="url(#shadow7)" rx="8"/>
  <text x="345" y="82" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">上下文窗口</text>
  <text x="345" y="102" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">一次能处理的Token数</text>
  <line x1="360" y1="115" x2="390" y2="120" stroke="#e67e22" stroke-width="1.5"/>
  
  <!-- 温度参数 -->
  <rect x="450" y="60" width="130" height="55" fill="#f39c12" filter="url(#shadow7)" rx="8"/>
  <text x="515" y="82" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Temperature</text>
  <text x="515" y="102" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">控制输出随机性</text>
  <line x1="480" y1="115" x2="455" y2="120" stroke="#f39c12" stroke-width="1.5"/>
  
  <!-- 幻觉 -->
  <rect x="620" y="80" width="120" height="55" fill="#e74c3c" filter="url(#shadow7)" rx="8"/>
  <text x="680" y="102" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">幻觉</text>
  <text x="680" y="122" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">编造不存在的信息</text>
  <line x1="620" y1="108" x2="485" y2="140" stroke="#e74c3c" stroke-width="1.5"/>
  
  <!-- 预训练 -->
  <rect x="120" y="210" width="120" height="55" fill="#27ae60" filter="url(#shadow7)" rx="8"/>
  <text x="180" y="232" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">预训练</text>
  <text x="180" y="252" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">海量数据通识学习</text>
  <line x1="240" y1="210" x2="365" y2="180" stroke="#27ae60" stroke-width="1.5"/>
  
  <!-- 微调 -->
  <rect x="280" y="240" width="130" height="55" fill="#1abc9c" filter="url(#shadow7)" rx="8"/>
  <text x="345" y="262" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">微调 (SFT)</text>
  <text x="345" y="282" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">特定任务适配训练</text>
  <line x1="360" y1="240" x2="400" y2="210" stroke="#1abc9c" stroke-width="1.5"/>
  
  <!-- RLHF -->
  <rect x="450" y="240" width="130" height="55" fill="#9b59b6" filter="url(#shadow7)" rx="8"/>
  <text x="515" y="262" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RLHF</text>
  <text x="515" y="282" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">人类反馈强化学习</text>
  <line x1="480" y1="240" x2="450" y2="210" stroke="#9b59b6" stroke-width="1.5"/>
  
  <!-- RAG -->
  <rect x="620" y="210" width="120" height="55" fill="#2980b9" filter="url(#shadow7)" rx="8"/>
  <text x="680" y="232" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RAG</text>
  <text x="680" y="252" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">检索增强生成</text>
  <line x1="620" y1="210" x2="485" y2="180" stroke="#2980b9" stroke-width="1.5"/>
  
  <!-- 底部关系说明 -->
  <rect x="80" y="330" width="750" height="160" fill="#fff8e1" stroke="#ffc107" stroke-width="1" rx="8"/>
  <text x="455" y="360" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#856404" text-anchor="middle">🔗 概念关系链</text>
  
  <text x="100" y="390" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start">1. <tspan font-weight="bold">预训练 → 微调 → RLHF</tspan> = 大模型训练的三部曲（通识教育 → 专业培训 → 价值观对齐）</text>
  <text x="100" y="415" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start">2. <tspan font-weight="bold">Token + 上下文窗口</tspan> = 决定模型一次能"看"多少内容（像人的工作记忆容量）</text>
  <text x="100" y="440" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start">3. <tspan font-weight="bold">Temperature</tspan> = 控制模型"创造力"的旋钮（低=严谨，高=发散）</text>
  <text x="100" y="465" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start">4. <tspan font-weight="bold">幻觉</tspan> = 模型的"职业病"，<tspan font-weight="bold">RAG</tspan>是最佳治疗方案（给模型配个"资料库"）</text>
</svg>