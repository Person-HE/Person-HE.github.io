<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg3)"/>
  
  <text x="450" y="35" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">Harness Engineering 五层架构</text>
  <text x="450" y="58" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">像驯马师驾驭烈马一样，通过五层工程化手段让Agent在生产环境中稳定运行</text>
  
  <!-- 左侧：驯马师比喻 -->
  <rect x="30" y="80" width="200" height="490" fill="#fff8e1" rx="10" stroke="#ffc107" stroke-width="2"/>
  <text x="130" y="105" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#f57f17" text-anchor="middle">驯马师比喻</text>
  
  <text x="130" y="140" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#424242" text-anchor="middle">烈马 = AI Agent</text>
  <text x="130" y="160" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#616161" text-anchor="middle">力量强大但方向不稳</text>
  
  <text x="130" y="210" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#424242" text-anchor="middle">缰绳 = 约束层</text>
  <text x="130" y="230" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#616161" text-anchor="middle">划定奔跑边界</text>
  
  <text x="130" y="280" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#424242" text-anchor="middle">望远镜 = 监控层</text>
  <text x="130" y="300" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#616161" text-anchor="middle">观察马的状态</text>
  
  <text x="130" y="350" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#424242" text-anchor="middle">口令 = 反馈层</text>
  <text x="130" y="370" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#616161" text-anchor="middle">及时调整方向</text>
  
  <text x="130" y="420" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#424242" text-anchor="middle">安全网 = 兜底层</text>
  <text x="130" y="440" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#616161" text-anchor="middle">防止摔落受伤</text>
  
  <text x="130" y="490" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#424242" text-anchor="middle">赛马记录 = 评估层</text>
  <text x="130" y="510" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#616161" text-anchor="middle">总结每次表现</text>
  
  <!-- 中间：五层架构（倒金字塔） -->
  <!-- 评估层（最上/最宽） -->
  <rect x="260" y="90" width="600" height="75" fill="#e8f5e9" rx="8" stroke="#4caf50" stroke-width="2" filter="url(#shadow3)"/>
  <text x="280" y="115" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">⑤ 评估层 Evaluation</text>
  <text x="280" y="135" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#424242">离线评测集 | 在线A/B测试 | Bad Case自动收集 | 效果回归测试</text>
  <text x="280" y="152" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#616161">"用数据说话，持续量化Agent的表现"</text>
  
  <!-- 兜底层 -->
  <rect x="280" y="180" width="560" height="75" fill="#fce4ec" rx="8" stroke="#e91e63" stroke-width="2" filter="url(#shadow3)"/>
  <text x="300" y="205" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#c2185b">④ 兜底层 Fallback</text>
  <text x="300" y="225" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#424242">模型调用失败 → 规则引擎 | 缓存答案 | 转人工客服 | 优雅降级</text>
  <text x="300" y="242" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#616161">"最后一道防线，确保用户始终得到响应"</text>
  
  <!-- 反馈层 -->
  <rect x="300" y="270" width="520" height="75" fill="#fff3e0" rx="8" stroke="#ff9800" stroke-width="2" filter="url(#shadow3)"/>
  <text x="320" y="295" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#e65100">③ 反馈层 Feedback Loop</text>
  <text x="320" y="315" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#424242">Human-in-the-loop（人工介入节点）| 自动重试机制 | 错误降级策略</text>
  <text x="320" y="332" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#616161">"人在回路，关键时刻人工把关；错误时自动恢复"</text>
  
  <!-- 监控层 -->
  <rect x="320" y="360" width="480" height="75" fill="#e3f2fd" rx="8" stroke="#2196f3" stroke-width="2" filter="url(#shadow3)"/>
  <text x="340" y="385" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">② 监控层 Observability</text>
  <text x="340" y="405" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#424242">执行链路追踪（Trace）| 工具调用日志 | Token消耗监控 | 延迟监控</text>
  <text x="340" y="422" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#616161">"全链路可观测，任何问题都有迹可循"</text>
  
  <!-- 约束层（最下/最窄，但最基础） -->
  <rect x="340" y="450" width="440" height="75" fill="#f3e5f5" rx="8" stroke="#9c27b0" stroke-width="2" filter="url(#shadow3)"/>
  <text x="360" y="475" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#6a1b9a">① 约束层 Constraints</text>
  <text x="360" y="495" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#424242">沙盒执行环境 | 权限控制（RBAC）| 输入校验 | 输出格式强制约束</text>
  <text x="360" y="512" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#616161">"先画好跑道，再让马奔跑——安全是第一要务"</text>
  
  <!-- 底部Agent -->
  <rect x="400" y="545" width="320" height="40" fill="#6f42c1" rx="6" filter="url(#shadow3)"/>
  <text x="560" y="570" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">AI Agent（被驾驭的"烈马"）</text>
</svg>